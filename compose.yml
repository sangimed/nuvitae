name: nuvitae

services:
  workspace:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
      args:
        USER_ID: ${LOCAL_UID:-1000}
        GROUP_ID: ${LOCAL_GID:-1000}
        PNPM_VERSION: 11.15.1
    image: nuvitae-workspace:0.1.0
    working_dir: /workspace
    volumes:
      - .:/workspace
      - pnpm-store:/pnpm/store
      - root-node-modules:/workspace/node_modules
      - web-node-modules:/workspace/apps/web/node_modules
      - api-node-modules:/workspace/apps/api/node_modules
      - worker-node-modules:/workspace/apps/worker/node_modules
      - contracts-node-modules:/workspace/packages/contracts/node_modules
      - domain-node-modules:/workspace/packages/domain/node_modules
      - extraction-node-modules:/workspace/packages/extraction/node_modules
      - import-application-node-modules:/workspace/packages/import-application/node_modules
      - persistence-node-modules:/workspace/packages/persistence/node_modules
      - storage-node-modules:/workspace/packages/storage/node_modules
      - fixtures-node-modules:/workspace/packages/test-fixtures/node_modules
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-nuvitae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nuvitae_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nuvitae}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-nuvitae_test}
      QUEUE_HOST: queue
      QUEUE_PORT: 6379
      QUEUE_PASSWORD: ${QUEUE_PASSWORD:-nuvitae_queue_password}
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      postgres:
        condition: service_healthy
      queue:
        condition: service_healthy
    profiles:
      - tools

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        PNPM_VERSION: 11.15.1
    image: nuvitae-web:0.1.0
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NUVITAE_LOCAL_PLAY_MODE: "false"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/health'').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      args:
        PNPM_VERSION: 11.15.1
    image: nuvitae-api:0.1.0
    environment:
      NODE_ENV: production
      PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-nuvitae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nuvitae_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nuvitae}
      POSTGRES_SSL: "false"
      POSTGRES_CONNECTION_TIMEOUT_MS: 3000
      POSTGRES_STATEMENT_TIMEOUT_MS: 2000
      NUVITAE_RUN_MIGRATIONS: "true"
      NUVITAE_LOCAL_PLAY_MODE: "false"
      QUEUE_HOST: queue
      QUEUE_PORT: 6379
      QUEUE_PASSWORD: ${QUEUE_PASSWORD:-nuvitae_queue_password}
      NUVITAE_PRIVATE_STORAGE_ROOT: /var/lib/nuvitae/private
      NUVITAE_PRIVATE_STORAGE_SIGNING_SECRET: ${NUVITAE_PRIVATE_STORAGE_SIGNING_SECRET:?NUVITAE_PRIVATE_STORAGE_SIGNING_SECRET must be configured}
      NUVITAE_PRIVATE_STORAGE_MAX_SIGNED_REFERENCE_TTL_SECONDS: 300
      NUVITAE_PROVIDER_SESSION_ROOT: /var/lib/nuvitae/private/provider-sessions
      NUVITAE_PROVIDER_SESSION_ENCRYPTION_SECRET: ${NUVITAE_PROVIDER_SESSION_ENCRYPTION_SECRET:?NUVITAE_PROVIDER_SESSION_ENCRYPTION_SECRET must be configured}
      NUVITAE_PROVIDER_SESSION_MAX_BYTES: 65536
      NUVITAE_COMMUNITY_ACCESS_SECRET: ${NUVITAE_COMMUNITY_ACCESS_SECRET:?NUVITAE_COMMUNITY_ACCESS_SECRET must be configured}
      NUVITAE_COMMUNITY_COOKIE_SECURE: ${NUVITAE_COMMUNITY_COOKIE_SECURE:?NUVITAE_COMMUNITY_COOKIE_SECURE must be configured}
      NUVITAE_COMMUNITY_SESSION_TTL_SECONDS: ${NUVITAE_COMMUNITY_SESSION_TTL_SECONDS:-86400}
      NUVITAE_COMMUNITY_FUNNEL_TELEMETRY_ENABLED: ${NUVITAE_COMMUNITY_FUNNEL_TELEMETRY_ENABLED:-false}
    volumes:
      - private-storage:/var/lib/nuvitae/private
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3001/health'').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      target: runtime
      args:
        PNPM_VERSION: 11.15.1
    image: nuvitae-worker:0.1.0
    environment:
      NODE_ENV: production
      NUVITAE_LOCAL_PLAY_MODE: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-nuvitae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nuvitae_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nuvitae}
      POSTGRES_CONNECTION_TIMEOUT_MS: 3000
      POSTGRES_STATEMENT_TIMEOUT_MS: 2000
      QUEUE_HOST: queue
      QUEUE_PORT: 6379
      QUEUE_PASSWORD: ${QUEUE_PASSWORD:-nuvitae_queue_password}
      WORKER_READY_FILE: /tmp/nuvitae-worker-ready
      PARSER_TMP_ROOT: /tmp/nuvitae-parser
      NUVITAE_PRIVATE_STORAGE_ROOT: /var/lib/nuvitae/private
      NUVITAE_PRIVATE_STORAGE_SIGNING_SECRET: ${NUVITAE_PRIVATE_STORAGE_SIGNING_SECRET:?NUVITAE_PRIVATE_STORAGE_SIGNING_SECRET must be configured}
      NUVITAE_PRIVATE_STORAGE_MAX_SIGNED_REFERENCE_TTL_SECONDS: 300
      NUVITAE_PROVIDER_SESSION_ROOT: /var/lib/nuvitae/private/provider-sessions
      NUVITAE_PROVIDER_SESSION_ENCRYPTION_SECRET: ${NUVITAE_PROVIDER_SESSION_ENCRYPTION_SECRET:?NUVITAE_PROVIDER_SESSION_ENCRYPTION_SECRET must be configured}
      NUVITAE_PROVIDER_SESSION_MAX_BYTES: 65536
    volumes:
      - private-storage:/var/lib/nuvitae/private
    tmpfs:
      - /tmp/nuvitae-parser:rw,noexec,nosuid,nodev,mode=0700,uid=10001,gid=10001,size=768m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/nuvitae-worker-ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  parser-test:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      target: parser-test
      args:
        PNPM_VERSION: 11.15.1
    image: nuvitae-parser-test:0.1.0
    working_dir: /workspace
    environment:
      PARSER_TMP_ROOT: /tmp/nuvitae-parser
    network_mode: none
    tmpfs:
      - /tmp/nuvitae-parser:rw,noexec,nosuid,nodev,mode=0700,uid=1000,gid=1000,size=768m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    profiles:
      - test

  postgres:
    image: postgres:17.10-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nuvitae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nuvitae_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nuvitae}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  queue:
    image: valkey/valkey:8.1.9-alpine3.24
    environment:
      QUEUE_PASSWORD: ${QUEUE_PASSWORD:-nuvitae_queue_password}
    command:
      [
        "valkey-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${QUEUE_PASSWORD:-nuvitae_queue_password}",
      ]
    volumes:
      - queue-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$${QUEUE_PASSWORD}" valkey-cli ping | grep PONG',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  test:
    build:
      context: .
      dockerfile: docker/test/Dockerfile
      args:
        USER_ID: ${LOCAL_UID:-1000}
        GROUP_ID: ${LOCAL_GID:-1000}
        PNPM_VERSION: 11.15.1
    image: nuvitae-test:0.1.0
    working_dir: /workspace
    environment:
      NEXT_TELEMETRY_DISABLED: 1
    volumes:
      - .:/workspace
      - pnpm-store:/pnpm/store
      - root-node-modules:/workspace/node_modules
      - web-node-modules:/workspace/apps/web/node_modules
      - contracts-node-modules:/workspace/packages/contracts/node_modules
      - extraction-node-modules:/workspace/packages/extraction/node_modules
      - import-application-node-modules:/workspace/packages/import-application/node_modules
    profiles:
      - test

  t201-authorization-test:
    build:
      context: .
      dockerfile: docker/test/t201-authorization.Dockerfile
      args:
        USER_ID: ${LOCAL_UID:-1000}
        GROUP_ID: ${LOCAL_GID:-1000}
        PNPM_VERSION: 11.15.1
    image: nuvitae-t201-authorization-test:0.1.0
    working_dir: /workspace
    volumes:
      - .:/workspace
      - pnpm-store:/pnpm/store
      - root-node-modules:/workspace/node_modules
    profiles:
      - test

  playwright-test:
    build:
      context: .
      dockerfile: docker/test/Dockerfile
      args:
        USER_ID: ${LOCAL_UID:-1000}
        GROUP_ID: ${LOCAL_GID:-1000}
        PNPM_VERSION: 11.15.1
    image: nuvitae-playwright-test:0.1.0
    working_dir: /workspace
    environment:
      NEXT_TELEMETRY_DISABLED: 1
      PLAYWRIGHT_OUTPUT_DIR: /workspace/.local-play/artifacts/test-results
    volumes:
      - .:/workspace:ro
      - ./.local-play/artifacts:/workspace/.local-play/artifacts
      - pnpm-store:/pnpm/store
      - root-node-modules:/workspace/node_modules
      - web-node-modules:/workspace/apps/web/node_modules
      - contracts-node-modules:/workspace/packages/contracts/node_modules
      - extraction-node-modules:/workspace/packages/extraction/node_modules
      - import-application-node-modules:/workspace/packages/import-application/node_modules
    profiles:
      - test

volumes:
  pnpm-store:
  root-node-modules:
  web-node-modules:
  api-node-modules:
  worker-node-modules:
  contracts-node-modules:
  domain-node-modules:
  extraction-node-modules:
  import-application-node-modules:
  persistence-node-modules:
  storage-node-modules:
  fixtures-node-modules:
  postgres-data:
  queue-data:
  private-storage:
