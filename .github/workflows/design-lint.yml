name: Design system lint

on:
  pull_request:
    paths:
      - ".stitch/DESIGN.md"
      - ".github/workflows/design-lint.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - ".stitch/DESIGN.md"
      - ".github/workflows/design-lint.yml"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  design-lint:
    runs-on: ubuntu-latest
    env:
      NUVITAE_PRIVATE_STORAGE_SIGNING_SECRET: ci-design-lint-storage-signing-secret
      NUVITAE_PROVIDER_SESSION_ENCRYPTION_SECRET: ci-design-lint-provider-session-encryption-secret
      NUVITAE_COMMUNITY_ACCESS_SECRET: ci-design-lint-community-access-secret
      NUVITAE_COMMUNITY_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Build the pinned workspace image
        run: docker compose build workspace
      - name: Install locked dependencies
        run: docker compose run --rm --no-deps workspace pnpm install --frozen-lockfile
      - name: Validate DESIGN.md
        run: docker compose run --rm --no-deps workspace pnpm design:lint
