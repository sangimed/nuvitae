name: Issue 122 validation

on:
  push:
    branches:
      - fix/122-persistence-integration

permissions:
  contents: read

jobs:
  validate:
    name: Full tests and PostgreSQL persistence
    runs-on: ubuntu-latest
    env:
      NUVITAE_PRIVATE_STORAGE_SIGNING_SECRET: issue-122-validation-storage-secret
      NUVITAE_PROVIDER_SESSION_ENCRYPTION_SECRET: issue-122-validation-provider-secret
      NUVITAE_COMMUNITY_ACCESS_SECRET: issue-122-validation-community-secret
      NUVITAE_COMMUNITY_COOKIE_SECURE: "false"
      QUALITY_PNPM_STORE: /tmp/nuvitae-issue-122-pnpm-store
    steps:
      - uses: actions/checkout@v7
      - name: Restore the pnpm content-addressable store
        uses: actions/cache@v6
        with:
          path: ${{ env.QUALITY_PNPM_STORE }}
          key: issue-122-pnpm-${{ runner.os }}-11.15.1-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Match the workspace container to the runner user
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
          mkdir -p "$QUALITY_PNPM_STORE"
      - name: Build the pinned workspace image
        run: docker compose -f compose.yml -f .github/compose.quality.yml build workspace
      - name: Install locked dependencies
        run: docker compose -f compose.yml -f .github/compose.quality.yml run --rm --no-deps workspace pnpm install --frozen-lockfile
      - name: Run full test suite
        run: docker compose -f compose.yml -f .github/compose.quality.yml run --rm --no-deps workspace pnpm test
      - name: Run PostgreSQL persistence integration
        run: docker compose -f compose.yml -f .github/compose.quality.yml run --rm workspace pnpm test:integration:persistence
