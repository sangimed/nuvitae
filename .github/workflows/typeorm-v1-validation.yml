name: TypeORM v1 validation

on:
  push:
    branches:
      - dependabot/npm_and_yarn/typeorm-1.1.1

permissions:
  contents: read

jobs:
  persistence-integration:
    name: PostgreSQL persistence integration
    runs-on: ubuntu-latest
    env:
      NUVITAE_PRIVATE_STORAGE_SIGNING_SECRET: typeorm-v1-validation-storage-secret
      NUVITAE_PROVIDER_SESSION_ENCRYPTION_SECRET: typeorm-v1-validation-provider-secret
      NUVITAE_COMMUNITY_ACCESS_SECRET: typeorm-v1-validation-community-secret
      NUVITAE_COMMUNITY_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Match workspace container to runner user
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build workspace
        run: docker compose build workspace
      - name: Install locked dependencies
        run: docker compose run --rm workspace pnpm install --frozen-lockfile
      - name: Run isolated PostgreSQL persistence integration tests
        run: docker compose run --rm workspace pnpm test:integration:persistence
