name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: pnpm lint
          - name: Formatting
            command: pnpm format:check
          - name: TypeScript
            command: pnpm typecheck
          - name: Tests
            command: pnpm test
          - name: Build
            command: pnpm build
    env:
      NUVITAE_PRIVATE_STORAGE_SIGNING_SECRET: ci-quality-storage-signing-secret
      NUVITAE_PROVIDER_SESSION_ENCRYPTION_SECRET: ci-quality-provider-session-encryption-secret
      NUVITAE_COMMUNITY_ACCESS_SECRET: ci-quality-community-access-secret
      NUVITAE_COMMUNITY_COOKIE_SECURE: "false"
      QUALITY_PNPM_STORE: ${{ runner.temp }}/pnpm-store
    steps:
      - uses: actions/checkout@v4
      - name: Restore the pnpm content-addressable store
        uses: actions/cache@v4
        with:
          path: ${{ env.QUALITY_PNPM_STORE }}
          key: pnpm-${{ runner.os }}-11.15.1-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Match the workspace container to the runner user
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
          mkdir -p "$QUALITY_PNPM_STORE"
      - name: Build the pinned workspace image
        run: docker compose -f compose.yml -f .github/compose.quality.yml build workspace
      - name: Install locked dependencies
        run: docker compose -f compose.yml -f .github/compose.quality.yml run --rm --no-deps workspace pnpm install --frozen-lockfile
      - name: Run ${{ matrix.name }}
        run: docker compose -f compose.yml -f .github/compose.quality.yml run --rm --no-deps workspace ${{ matrix.command }}
