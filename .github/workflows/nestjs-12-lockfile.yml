name: NestJS 12 lockfile refresh

on:
  push:
    branches:
      - chore/121-nestjs-12-migration

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/121-nestjs-12-migration
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.15.1
      - name: Regenerate pnpm lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(nest): refresh lockfile for NestJS 12"
          git push origin HEAD:chore/121-nestjs-12-migration
