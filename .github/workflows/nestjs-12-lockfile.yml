name: NestJS 12 lockfile refresh

on:
  push:
    branches:
      - chore/121-nestjs-12-migration

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/121-nestjs-12-migration
      - name: Match workspace container to runner user
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build pinned workspace
        run: docker compose build workspace
      - name: Regenerate pnpm lockfile
        run: docker compose run --rm --no-deps workspace pnpm install --lockfile-only
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(nest): refresh lockfile for NestJS 12"
          git push origin HEAD:chore/121-nestjs-12-migration
